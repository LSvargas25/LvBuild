name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Projects target net8.0. The .slnx solution format needs SDK >= 9.0.200, so the
      # SDK comes from 10.0.x (same as local dev) and the 8.0 runtime runs the tests.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Check formatting (CSharpier)
        run: |
          dotnet tool install --global csharpier --version 1.3.0
          csharpier check .

      # Directory.Build.props sets TreatWarningsAsErrors when CI=true (always set on Actions).
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests start postgres:16-alpine through Testcontainers, using the
      # Docker engine that ubuntu-latest runners provide.
      - name: Test (with coverage)
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      # Generated EF Core migrations are excluded: they are not hand-written code.
      - name: Coverage report
        if: always()
        run: |
          if ! ls TestResults/*/coverage.cobertura.xml >/dev/null 2>&1; then
            echo "No coverage file produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.10
          reportgenerator \
            "-reports:TestResults/*/coverage.cobertura.xml" \
            "-targetdir:CoverageReport" \
            "-reporttypes:MarkdownSummaryGithub;Html" \
            "-assemblyfilters:-LvTest" \
            "-classfilters:-LvInfrastructure.Migrations.*"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) {
            "### Tests`n`nNo test results were produced (the build or test step failed before running tests)." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          [xml]$doc = Get-Content $trx.FullName
          $ns = @{ t = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010" }
          $c = (Select-Xml -Xml $doc -XPath "//t:ResultSummary/t:Counters" -Namespace $ns).Node
          $icon = if ([int]$c.failed -gt 0) { ":x:" } else { ":white_check_mark:" }
          $lines = @(
            "### $icon Tests",
            "",
            "| Total | Passed | Failed | Skipped |",
            "|---|---|---|---|",
            "| $($c.total) | $($c.passed) | $($c.failed) | $([int]$c.total - [int]$c.executed) |"
          )
          $failed = Select-Xml -Xml $doc -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns
          if ($failed) {
            $lines += "", "#### Failed tests", ""
            foreach ($f in $failed) {
              $msg = $f.Node.Output.ErrorInfo.Message -replace "\r?\n", " "
              if ($msg.Length -gt 300) { $msg = $msg.Substring(0, 300) + "..." }
              $lines += "- ``$($f.Node.testName)``: $msg"
            }
          }
          $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            CoverageReport/
          if-no-files-found: ignore

  # Builds the production image and runs it the way Render does (PORT, behind a proxy, migrate
  # and seed on startup) against a real PostgreSQL, then exercises it over HTTP.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lvbuild
          POSTGRES_USER: lvbuild
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lvbuild -d lvbuild"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag lvbuild-api:ci .

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run --detach --name api --network host \
            -e PORT=8081 \
            -e ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=lvbuild;Username=lvbuild;Password=ci-only-password" \
            -e Jwt__Key="$(openssl rand -base64 48)" \
            -e Jwt__Issuer=LvConstruccionesApi \
            -e Jwt__Audience=LvConstruccionesClient \
            -e Database__MigrateOnStartup=true \
            -e Seed__Demo=true \
            -e Swagger__Enabled=true \
            -e ReverseProxy__Enabled=true \
            lvbuild-api:ci

          api=http://localhost:8081
          for _ in $(seq 1 60); do
            curl --silent --fail "$api/health/ready" > /dev/null && break
            sleep 2
          done
          curl --silent --fail "$api/health" | jq .
          curl --silent --fail "$api/health/ready" | jq -e '.status == "Healthy"'

          test "$(docker exec api id -u)" != "0" || { echo "container runs as root"; exit 1; }

          token=$(curl --silent --fail -X POST "$api/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"gerencia@lvbuild.test","password":"LvBuild#2026"}' | jq -r .accessToken)
          auth=(-H "Authorization: Bearer $token")

          project=$(curl --silent --fail "${auth[@]}" "$api/api/projects" | jq -r '.items[0].id')
          curl --silent --fail "${auth[@]}" \
            "$api/api/projects/$project/finance?period=Month&date=$(date +%F)" | jq .

          offer=$(curl --silent --fail "${auth[@]}" "$api/api/offers" | jq -r '.items[0].id')
          curl --silent --fail "${auth[@]}" "$api/api/offers/$offer/pdf" --output offer.pdf
          head -c 5 offer.pdf | grep -q '%PDF-'

          curl --silent --fail "$api/swagger/v1/swagger.json" | jq -e '.info.title == "LvBuild API"'

      - name: Container logs
        if: always()
        run: docker logs api || true
